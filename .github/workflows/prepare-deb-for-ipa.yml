name: Prepare EeveeSpotify DEB for IPA build

on:
  push:
    branches:
      - build/eevee-ipa-prep-20261017

permissions:
  contents: read

jobs:
  build-deb:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: rootless
      SWIFTPROTOBUF_VERSION: "1.29.0"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install build tools
        run: |
          brew install make dpkg ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build EeveeSwiftProtobuf
        run: make build-eeveeswiftprotobuf

      - name: Build rootless tweak package
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          test -n "$(find packages -maxdepth 1 -name '*.deb' -type f -print -quit)"

      - name: Validate tweak package
        run: |
          DEB="$(find packages -maxdepth 1 -name '*.deb' -type f -print -quit)"
          dpkg-deb --info "$DEB"
          EXTRACT_DIR="$RUNNER_TEMP/eevee-extracted"
          mkdir -p "$EXTRACT_DIR"
          dpkg-deb -x "$DEB" "$EXTRACT_DIR"
          test -n "$(find "$EXTRACT_DIR" -type f -name 'EeveeSpotify.dylib' -print -quit)"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-rootless-DEB
          path: packages/*.deb
          if-no-files-found: error
